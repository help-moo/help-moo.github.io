<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animales en Wampis — Enero 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Noto+Serif:ital,wght@0,400;0,600;1,400&family=Fira+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f5f0e8;
  --ink: #1a160e;
  --ink-mid: #4a3f30;
  --ink-light: #8a7a65;
  --accent: #7b3c1f;
  --accent2: #3d6b4f;
  --accent3: #1d4f7a;
  --tag-bg: #e8e0d0;
  --card-bg: #faf7f2;
  --border: #d0c8b8;
  --shadow: rgba(60,40,10,0.10);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Noto Serif', Georgia, serif;
  background: var(--bg);
  color: var(--ink);
  min-height: 100vh;
  line-height: 1.6;
}

/* HEADER */
header {
  background: var(--ink);
  color: var(--bg);
  padding: 2.5rem 1.5rem 2rem;
  text-align: center;
  border-bottom: 4px solid var(--accent);
}
header .subtitle-lang {
  font-family: 'Fira Mono', monospace;
  font-size: 0.7rem;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: #c0b090;
  margin-bottom: 0.6rem;
}
header h1 {
  font-family: 'Playfair Display', Georgia, serif;
  font-size: clamp(1.6rem, 5vw, 2.8rem);
  font-weight: 700;
  letter-spacing: -0.01em;
  line-height: 1.2;
  color: #f5f0e8;
}
header .tagline {
  font-family: 'Playfair Display', Georgia, serif;
  font-style: italic;
  font-size: clamp(0.85rem, 2.5vw, 1.05rem);
  color: #b0a080;
  margin-top: 0.5rem;
}
header .stats-row {
  display: flex;
  justify-content: center;
  gap: 2rem;
  margin-top: 1.2rem;
  flex-wrap: wrap;
}
.stat-pill {
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 2rem;
  padding: 0.3rem 1rem;
  font-family: 'Fira Mono', monospace;
  font-size: 0.78rem;
  color: #e0d8c8;
}
.stat-pill strong { color: #f5f0e8; }

/* CONTROLS */
.controls {
  position: sticky;
  top: 0;
  z-index: 100;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  padding: 0.8rem 1.2rem;
  box-shadow: 0 2px 8px var(--shadow);
}
.controls-inner {
  max-width: 1100px;
  margin: 0 auto;
  display: flex;
  gap: 0.6rem;
  flex-wrap: wrap;
  align-items: center;
}
#search {
  flex: 1 1 180px;
  min-width: 140px;
  padding: 0.45rem 0.75rem;
  border: 1.5px solid var(--border);
  border-radius: 6px;
  font-family: 'Noto Serif', serif;
  font-size: 0.88rem;
  background: var(--card-bg);
  color: var(--ink);
  outline: none;
  transition: border-color 0.15s;
}
#search:focus { border-color: var(--accent); }
#search::placeholder { color: var(--ink-light); }

select {
  padding: 0.45rem 0.6rem;
  border: 1.5px solid var(--border);
  border-radius: 6px;
  font-family: 'Noto Serif', serif;
  font-size: 0.82rem;
  background: var(--card-bg);
  color: var(--ink);
  cursor: pointer;
  outline: none;
  max-width: 160px;
}
select:focus { border-color: var(--accent2); }

.count-badge {
  margin-left: auto;
  font-family: 'Fira Mono', monospace;
  font-size: 0.75rem;
  color: var(--ink-light);
  white-space: nowrap;
}

/* CLASE TABS */
.tabs {
  max-width: 1100px;
  margin: 1rem auto 0;
  padding: 0 1.2rem;
  display: flex;
  gap: 0.4rem;
  flex-wrap: wrap;
}
.tab {
  padding: 0.3rem 0.8rem;
  border-radius: 2rem;
  border: 1.5px solid var(--border);
  font-family: 'Noto Serif', serif;
  font-size: 0.8rem;
  cursor: pointer;
  background: var(--card-bg);
  color: var(--ink-mid);
  transition: all 0.15s;
  user-select: none;
}
.tab:hover { border-color: var(--accent); color: var(--accent); }
.tab.active {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}
.tab .tab-count {
  font-family: 'Fira Mono', monospace;
  font-size: 0.72em;
  opacity: 0.75;
  margin-left: 0.3em;
}

/* GRID */
main {
  max-width: 1100px;
  margin: 1.2rem auto 3rem;
  padding: 0 1rem;
}
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr));
  gap: 1rem;
}

/* CARD */
.card {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 1rem 1.1rem 0.9rem;
  cursor: pointer;
  transition: box-shadow 0.18s, transform 0.12s;
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 0.4rem;
}
.card:hover {
  box-shadow: 0 4px 16px var(--shadow);
  transform: translateY(-1px);
}
.card-top {
  display: flex;
  align-items: baseline;
  gap: 0.6rem;
  flex-wrap: wrap;
}
.card-nombre {
  font-family: 'Playfair Display', Georgia, serif;
  font-size: 1.15rem;
  font-weight: 700;
  color: var(--accent);
  line-height: 1.2;
}
.card-clase {
  font-family: 'Fira Mono', monospace;
  font-size: 0.68rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-light);
}
.card-esp {
  font-size: 0.88rem;
  color: var(--ink-mid);
  font-style: italic;
  line-height: 1.35;
}
.card-sci {
  font-family: 'Noto Serif', serif;
  font-style: italic;
  font-size: 0.76rem;
  color: var(--ink-light);
}
.card-tags {
  display: flex;
  gap: 0.35rem;
  flex-wrap: wrap;
  margin-top: 0.2rem;
}
.tag {
  padding: 0.15rem 0.5rem;
  border-radius: 3px;
  font-family: 'Fira Mono', monospace;
  font-size: 0.68rem;
  background: var(--tag-bg);
  color: var(--ink-mid);
  border: 1px solid var(--border);
}
.tag.est { background: #e8f0e8; border-color: #b0c8b0; color: #2a5a3a; }
.tag.candoshi { background: #e8eef8; border-color: #a0b8d8; color: #1a4070; }

/* MODAL */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(26,22,14,0.65);
  z-index: 200;
  padding: 1.5rem 1rem;
  overflow-y: auto;
  backdrop-filter: blur(2px);
  align-items: flex-start;
  justify-content: center;
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--card-bg);
  border-radius: 10px;
  padding: 1.8rem 1.8rem 1.5rem;
  max-width: 560px;
  width: 100%;
  margin: auto;
  position: relative;
  box-shadow: 0 12px 40px rgba(26,22,14,0.3);
  border: 1px solid var(--border);
}
.modal-close {
  position: absolute;
  top: 0.9rem; right: 1rem;
  background: none; border: none;
  font-size: 1.4rem; cursor: pointer;
  color: var(--ink-light);
  line-height: 1;
}
.modal-close:hover { color: var(--accent); }
.modal-nombre {
  font-family: 'Playfair Display', Georgia, serif;
  font-size: 1.9rem;
  font-weight: 700;
  color: var(--accent);
  margin-bottom: 0.2rem;
  line-height: 1.15;
}
.modal-clase-row {
  display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center;
  margin-bottom: 1rem;
}
.modal-fields {
  display: grid;
  gap: 0.7rem;
}
.field { display: flex; flex-direction: column; gap: 0.15rem; }
.field-label {
  font-family: 'Fira Mono', monospace;
  font-size: 0.65rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--ink-light);
}
.field-val {
  font-size: 0.93rem;
  color: var(--ink);
  line-height: 1.4;
}
.field-val.italic { font-style: italic; }
.field-val.mono {
  font-family: 'Fira Mono', monospace;
  font-size: 0.82rem;
  background: var(--tag-bg);
  padding: 0.3rem 0.5rem;
  border-radius: 4px;
  color: var(--ink-mid);
}
.modal-divider { height: 1px; background: var(--border); margin: 0.5rem 0; }

/* empty */
.empty {
  text-align: center; padding: 4rem 1rem;
  color: var(--ink-light); font-style: italic;
  font-size: 1rem;
}

/* colors per clase */
.clase-ave    { --cls-c: #1a5c8a; }
.clase-mamifero { --cls-c: #7b3c1f; }
.clase-artropodo { --cls-c: #5a3a8a; }
.clase-pez    { --cls-c: #1d6a5a; }
.clase-reptil { --cls-c: #6a5a1a; }
.clase-anfibio { --cls-c: #3a6a2a; }
.clase-molusco { --cls-c: #8a3a5a; }
.clase-anelido { --cls-c: #6a4a2a; }
.clase-other  { --cls-c: #5a5a5a; }

@media (max-width: 500px) {
  .controls-inner { gap: 0.4rem; }
  select { max-width: 110px; }
  .modal { padding: 1.3rem 1.1rem 1.2rem; }
  .modal-nombre { font-size: 1.5rem; }
}
</style>
</head>

<header>

estrategias.forEach(e => {
  const opt = document.createElement('option');
  opt.value = e;
  opt.textContent = e.charAt(0).toUpperCase() + e.slice(1);
  sel.appendChild(opt);
});

// Build tabs
const tabsEl = document.getElementById('clase-tabs');
let activeClase = '';

function buildTabs() {
  tabsEl.innerHTML = '';
  const all = document.createElement('button');
  all.className = 'tab' + (activeClase === '' ? ' active' : '');
  all.textContent = 'Todos';
  const totalCount = Object.values(claseCounts).reduce((a,b)=>a+b,0);
  all.innerHTML += `<span class="tab-count">(${totalCount})</span>`;
  all.onclick = () => { activeClase = ''; buildTabs(); render(); };
  tabsEl.appendChild(all);

  Object.entries(claseCounts).sort((a,b)=>b[1]-a[1]).forEach(([c, n]) => {
    const btn = document.createElement('button');
    btn.className = 'tab clase-' + (CLASE_CSS[c]||'other') + (activeClase === c ? ' active' : '');
    const label = CLASE_LABELS[c] || c;
    btn.innerHTML = `${label}<span class="tab-count">(${n})</span>`;
    btn.onclick = () => { activeClase = c; buildTabs(); render(); };
    tabsEl.appendChild(btn);
  });
}

buildTabs();

// Filter & render
function filtered() {
  const q = document.getElementById('search').value.toLowerCase().trim();
  const est = document.getElementById('estrategia-filter').value;
  const can = document.getElementById('candoshi-filter').value;
  return DATA.filter(d => {
    if (activeClase && d.clase !== activeClase) return false;
    if (est && d.estrategia !== est) return false;
    if (can && d.candoshi !== can) return false;
    if (q) {
      const hay = [d.nombre, d.castellano, d.regional, d.cientifico, d.morfemica, d.comentario]
        .filter(Boolean).join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}

function claseClass(c) {
  return 'clase-' + (CLASE_CSS[c||''] || 'other');
}

function makeCard(d) {
  const div = document.createElement('div');
  div.className = 'card ' + claseClass(d.clase);
  
  const top = document.createElement('div');
  top.className = 'card-top';
  const nom = document.createElement('span');
  nom.className = 'card-nombre';
  nom.textContent = d.nombre || '—';
  const cls = document.createElement('span');
  cls.className = 'card-clase';
  cls.textContent = d.clase ? (CLASE_LABELS[d.clase] || d.clase) : '';
  top.appendChild(nom);
  top.appendChild(cls);
  div.appendChild(top);

  if (d.castellano) {
    const esp = document.createElement('div');
    esp.className = 'card-esp';
    esp.textContent = d.castellano;
    div.appendChild(esp);
  } else if (d.regional) {
    const esp = document.createElement('div');
    esp.className = 'card-esp';
    esp.textContent = d.regional;
    div.appendChild(esp);
  }
  
  if (d.cientifico) {
    const sci = document.createElement('div');
    sci.className = 'card-sci';
    sci.textContent = d.cientifico;
    div.appendChild(sci);
  }

  const tags = document.createElement('div');
  tags.className = 'card-tags';
  if (d.estrategia) {
    const t = document.createElement('span');
    t.className = 'tag est';
    t.textContent = d.estrategia;
    tags.appendChild(t);
  }
  if (d.candoshi === 'sí') {
    const t = document.createElement('span');
    t.className = 'tag candoshi';
    t.textContent = 'sim. candoshi';
    tags.appendChild(t);
  }
  if (d.subclase) {
    const t = document.createElement('span');
    t.className = 'tag';
    t.textContent = d.subclase;
    tags.appendChild(t);
  }
  if (tags.children.length) div.appendChild(tags);

  div.onclick = () => openModal(d);
  return div;
}

function render() {
  const items = filtered();
  const grid = document.getElementById('grid');
  const empty = document.getElementById('empty');
  grid.innerHTML = '';
  document.getElementById('count-badge').textContent = `${items.length} resultado${items.length !== 1 ? 's' : ''}`;
  document.getElementById('total-count').textContent = items.length;
  
  if (items.length === 0) {
    empty.style.display = '';
  } else {
    empty.style.display = 'none';
    const frag = document.createDocumentFragment();
    items.forEach(d => frag.appendChild(makeCard(d)));
    grid.appendChild(frag);
  }
}

render();

// Modal
function openModal(d) {
  document.getElementById('m-nombre').textContent = d.nombre || '—';
  
  const claseRow = document.getElementById('m-clase-row');
  claseRow.innerHTML = '';
  const addTag = (txt, cls) => {
    const t = document.createElement('span');
    t.className = 'tag ' + (cls||'');
    t.textContent = txt;
    claseRow.appendChild(t);
  };
  if (d.clase) addTag(CLASE_LABELS[d.clase] || d.clase);
  if (d.subclase) addTag(d.subclase);
  if (d.estrategia) addTag(d.estrategia, 'est');
  if (d.candoshi === 'sí') addTag('similitud con candoshi', 'candoshi');

  const fields = document.getElementById('m-fields');
  fields.innerHTML = '';
  const addField = (label, val, cls) => {
    if (!val) return;
    const wrap = document.createElement('div');
    wrap.className = 'field';
    wrap.innerHTML = `<span class="field-label">${label}</span><span class="field-val ${cls||''}">${val}</span>`;
    fields.appendChild(wrap);
  };

  if (d.castellano && d.regional) {
    addField('Castellano general', d.castellano, 'italic');
    addField('Castellano regional', d.regional, 'italic');
  } else if (d.castellano) {
    addField('Castellano', d.castellano, 'italic');
  } else if (d.regional) {
    addField('Castellano regional', d.regional, 'italic');
  }
  addField('Nombre científico', d.cientifico, 'italic');
  
  const div = document.createElement('div'); div.className = 'modal-divider';
  fields.appendChild(div);

  addField('Análisis morfémico', d.morfemica, 'mono');
  
  if (d.candoshi === 'sí' && d.candoshi_raw) {
    addField('Similitud Candoshi', d.candoshi_raw);
  }
  
  addField('Comentario', d.comentario);
  
  document.getElementById('modal-overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

document.getElementById('modal-close').onclick = closeModal;
document.getElementById('modal-overlay').onclick = (e) => {
  if (e.target === document.getElementById('modal-overlay')) closeModal();
};
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
  document.body.style.overflow = '';
}

// Events
document.getElementById('search').addEventListener('input', render);
document.getElementById('estrategia-filter').addEventListener('change', render);
document.getElementById('candoshi-filter').addEventListener('change', render);
</script>
</body>
</html>
